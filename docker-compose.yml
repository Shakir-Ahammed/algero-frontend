services:
  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: algero-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algero}
      POSTGRES_USER: ${POSTGRES_USER:-algero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algero_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algero} -d ${POSTGRES_DB:-algero}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: algero-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Algero}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-algero}:${POSTGRES_PASSWORD:-algero_secret}@postgres:5432/${POSTGRES_DB:-algero}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${APP_URL:-http://localhost:8000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@algero.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algero-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
