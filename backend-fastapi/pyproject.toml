[project]
name = "algero-backend"
version = "0.1.0"
description = "Algero FastAPI backend (migrated from Laravel)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
