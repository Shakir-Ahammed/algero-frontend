services:
  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: algero-postgres
    environment:
      POSTGRES_DB: algero
      POSTGRES_USER: algero
      POSTGRES_PASSWORD: algero_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algero -d algero"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: algero-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Algero
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://algero:algero@postgres:5432/algero
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: https://algero.bitbd.net,https://algero-backend.bitbd.net
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: https://algero-backend.bitbd.net
      ADMIN_EMAIL: admin@algero.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-P@ssw0rd!}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── React Frontend ────────────────────────────────────────
  frontend:
    image: shafiunmiraz/algero:frontend-v2
    container_name: algero-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: https://algero-backend.bitbd.net
      VITE_RECAPTCHA_SITE_KEY: 6LdE8RgtAAAAAFmyZ_N5W__JBq21WkawDR_pypCG
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
