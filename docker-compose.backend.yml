services:
  # ─── FastAPI Backend (standalone) ───────────────────────────
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: algero-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Algero
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://algero:algero@postgres:5432/algero
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      RECAPTCHA_SECRET: ""
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_EMAIL: admin@algero.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-P@ssw0rd!}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
